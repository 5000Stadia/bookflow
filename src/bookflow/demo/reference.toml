# Row 16 customer work: linked non-posting proposal, alternative estimates,
# accepted alternative, work order and completion. Nothing here posts, so the
# ledger, customer balances and account balances above are unchanged.

[[commands]]
command = "custom-field create"
capture = "work_permit"
reason = "Capture a typed permit fact on customer work documents"
input = { "name" = "Permit pulled", "kind" = "bool", "scopes" = ["proposal", "estimate", "work_order"], "default" = true }

[[commands]]
command = "proposal create"
capture = "work_proposal"
reason = "Propose a bathroom refit with markup, amount, unknown-cost, zero-cost and nonbillable lines"
input = { "date" = "2026-09-08", "number" = "REF-WORK-PROP-1", "customer" = "${sale_customer.id}", "title" = "Bathroom refit", "sales_tax_item" = "${sale_tax.id}", "customer_tax_code" = "${sale_taxable.id}", "scope" = "Replace the vanity, tap and supply lines in the main bathroom.", "exclusions" = "Tile and paint are not included.", "memo" = "Internal: customer prefers morning visits.", "lines" = [{ "item" = "${sale_service.id}", "quantity" = "2", "description" = "Vanity installation, cost plus markup", "estimated_unit_cost" = "4.00", "markup_percent" = "25" }, { "item" = "${sale_service.id}", "quantity" = "2", "description" = "Tap replacement, quoted as an amount", "net_amount" = "10.01" }, { "item" = "${sale_service.id}", "quantity" = "1", "description" = "Supply line check at catalog price, cost unknown" }, { "item" = "${sale_service.id}", "quantity" = "3", "description" = "Warranty visits at zero cost with markup", "estimated_unit_cost" = "0", "markup_percent" = "50" }, { "item" = "${sale_service.id}", "quantity" = "1", "description" = "Courtesy inspection, not billable", "unit_price" = "20.00", "billable" = false, "tax_code" = "${sale_exempt.id}" }], "custom_fields" = { "${work_permit.id}" = false }, "custom_field_kinds" = { "${work_permit.id}" = "bool" } }

[[commands]]
command = "proposal update"
capture = "work_proposal_cleared"
reason = "Clear the permit fact; the earlier false value stays in revision history"
input = { "proposal" = "${work_proposal.id}", "expected_version" = "${work_proposal.version}", "custom_fields" = { "${work_permit.id}" = "${null}" } }

[[commands]]
command = "proposal update"
