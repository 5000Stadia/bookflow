# Fixed 2026 domestic reference journals; amounts are exact USD decimal strings.
[company]
legal_name = "Reference Plumbing Company LLC"
display_name = "Reference Plumbing Co"
home_currency = "USD"
timezone = "America/Chicago"
chart = "contractor"
fiscal_year_start_month = 1
report_basis = "accrual"

[[commands]]
command = "account create"
reason = "Create reference account: Equipment"
input = { name = "Equipment", type = "fixed_asset" }

