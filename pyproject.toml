[project]
name = "bookflow"
version = "0.0.1"
description = "Multi-company double-entry accounting core with a command set exposed through a CLI, an HTTP host, a web workbench, and an MCP server."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "python-ulid>=2.7",
    "tzlocal>=5.2",
]

[project.scripts]
bookflow = "bookflow.adapters.cli.app:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
