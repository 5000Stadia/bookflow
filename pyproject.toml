[project]
name = "bookflow-core"
version = "0.0.1"
description = "Multi-company double-entry accounting core with a command set exposed through a CLI, an HTTP host, and a browser workbench."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "python-ulid>=2.7",
    "tzlocal>=5.2",
    "tzdata>=2024.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
bookflow = "bookflow.bootstrap:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2.3", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bookflow"]

[tool.hatch.build.targets.sdist]
exclude = ["/.agentpost.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 60
